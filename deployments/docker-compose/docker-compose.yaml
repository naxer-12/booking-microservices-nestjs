services:
  #######################################################
  #  Rabbitmq
  #######################################################
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - booking

  #######################################################
  #  Postgress
  #######################################################
  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount the initialization script here
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    networks:
      - booking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  #######################################################
  #  Prometheus
  #######################################################
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./../configs/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      - "--log.level=debug"
    networks:
      - booking

  #######################################################
  #  Tempo
  #######################################################
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./../configs/tempo.yaml:/etc/tempo.yaml
    expose:
      - 3200 
      - 9095 
      - 4317 
      - 4318 
    networks:
      - booking

  #######################################################
  #  Loki
  #######################################################
  loki:
    image: grafana/loki:latest
    hostname: loki
    container_name: loki
    expose:
      - 3100
      - 9096
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./../configs/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - booking

  #######################################################
  #  Grafana
  #######################################################
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./../configs/grafana/provisioning:/etc/grafana/provisioning
      - ./../configs/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - booking

  #######################################################
  #  OtelCollector
  #######################################################      
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./../configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "11888:1888"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    environment:
      - ASPIRE_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - ASPIRE_API_KEY=your_api_key
      - PROMETHEUS_ENDPOINT=0.0.0.0:8889
      - PROMETHEUS_REMOTE_WRITE_ENDPOINT=http://prometheus:9090/api/v1/write
      - LOKI_ENDPOINT=http://loki:3100/otlp
      - TEMPO_ENDPOINT=http://tempo:4317
    networks:
      - booking

  #######################################################
  #  Identity
  #######################################################
  identity:
    build:
      context: ../..
      dockerfile: src/identity/Dockerfile
    container_name: identity
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ../../src/identity/.env.docker
    ports:
      - "3333:3333"
    networks:
      - booking

  #######################################################
  #  Flight
  #######################################################
  flight:
    build:
      context: ../..
      dockerfile: src/flight/Dockerfile
    container_name: flight
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ../../src/flight/.env.docker
    ports:
      - "3344:3344"
    networks:
      - booking

  #######################################################
  #  Passenger
  #######################################################
  passenger:
    build:
      context: ../..
      dockerfile: src/passenger/Dockerfile
    container_name: passenger
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ../../src/passenger/.env.docker
    ports:
      - "3355:3355"
    networks:
      - booking

  #######################################################
  #  Booking
  #######################################################
  booking:
    build:
      context: ../..
      dockerfile: src/booking/Dockerfile
    container_name: booking
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ../../src/booking/.env.docker
    ports:
      - "3366:3366"
    networks:
      - booking

networks:
  booking:

volumes:
  postgres-data: